[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phishlens"
version = "0.1.0"
description = "An interactive analysis lens for suspicious .eml files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["email", "phishing", "eml", "dfir", "security", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
    "Topic :: Security",
]
dependencies = ["textual>=0.80"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
phishlens = "phishlens.cli:main"

[project.urls]
Homepage = "https://github.com/iamjoshgilman/phishlens"
Issues = "https://github.com/iamjoshgilman/phishlens/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/phishlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The rule modules are imported for their registration side effect.
"src/phishlens/rules/__init__.py" = ["E402", "F401"]
