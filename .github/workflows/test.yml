name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
        include:
          # Oldest and newest supported, on Linux only, to keep the grid small.
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

      # The reports carry the non-ASCII found in the message, so prove the CLI
      # survives a console that cannot represent it. On Windows this is the
      # real legacy code page, not a simulation.
      - name: CLI smoke on a legacy console (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          chcp 1252
          for %%f in (--json --findings --iocs --tree) do (
            python -m franking %%f tests/fixtures/evasive.eml > nul
            if errorlevel 2 exit /b 1
          )
          exit /b 0

      - name: CLI smoke (POSIX)
        if: runner.os != 'Windows'
        # Exit 1 means HIGH findings, which is the expected result for this
        # fixture; only 2+ is a real failure.
        run: |
          for flag in --json --findings --iocs --tree; do
            python -m franking "$flag" tests/fixtures/evasive.eml > /dev/null
            rc=$?
            if [ "$rc" -ge 2 ]; then echo "$flag exited $rc"; exit 1; fi
          done
          python -m franking --rules > /dev/null
